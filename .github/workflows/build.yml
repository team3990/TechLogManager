name: Build

on: workflow_dispatch

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-x64
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test TechLogManager.slnx
      - name: Publish GUI
        run: dotnet publish src/TechLogManager -c Release -r ${{ matrix.runtime }} -o publish/gui
      - name: Publish CLI
        run: dotnet publish src/TechLogManager.Cli -c Release -r ${{ matrix.runtime }} -o publish/cli
      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}-gui
          path: publish/gui
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}-cli
          path: publish/cli
